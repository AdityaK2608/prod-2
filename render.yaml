services:
  - type: web
    name: sentinel-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://adityak2608.github.io
      - key: MONGODB_URI
        sync: false
      - key: NVD_API_KEY
        sync: false
