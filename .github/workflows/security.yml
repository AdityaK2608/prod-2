name: Production Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    name: Static security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for dangerous JavaScript patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='security.yml' '(^|[^[:alnum:]_])eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write[[:space:]]*\(' --include='*.js' .; then
            echo 'Dangerous JavaScript pattern detected.'
            exit 1
          fi

      - name: Check for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='security.yml' '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' --include='*.js' --include='*.json' --include='*.html' --include='*.yml' --include='*.yaml' .; then
            echo 'Possible secret material detected.'
            exit 1
          fi

      - name: Check forbidden end-user import/export UI hooks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git 'Import questions|Export questions|Import Question Bank|Export Question Bank' --include='*.html' --include='*.js' --include='*.css' .; then
            echo 'Potential end-user import/export surface detected.'
            exit 1
          fi

      - name: Validate required production files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html stable-fix.js exam-lock.js question-bank.js security.js; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
