<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0f">
  <title>Production Loading</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;background:#080a0f;color:#f7f8fa}body{min-height:100vh}.page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(109,93,252,.13),transparent 38%),#080a0f}.glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(110px);opacity:.18;pointer-events:none}.one{top:-210px;left:-130px;background:#6d5dfc}.two{right:-120px;bottom:-230px;background:#20c9a6}.card{width:min(620px,100%);padding:58px 46px 48px;text-align:center;position:relative;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(17,20,28,.82);box-shadow:0 30px 90px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(18px)}.badge{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid rgba(255,255,255,.09);border-radius:999px;color:#aeb5c5;font-size:18px;font-weight:800;letter-spacing:.08em}.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 5px rgba(52,211,153,.1);animation:pulse 1.8s infinite}.loader{width:108px;height:108px;margin:40px auto 30px;display:grid;place-items:center;position:relative}.ring{position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-top-color:#9b91ff;border-radius:50%;animation:spin 1.4s linear infinite}.loader:after{content:"";position:absolute;inset:11px;border:1px dashed rgba(255,255,255,.08);border-radius:50%;animation:spin 5s linear infinite reverse}.loader span{font-size:18px;font-weight:800;letter-spacing:.1em;color:#d9dce5}.eyebrow{margin:0 0 12px;color:#9b91ff;font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:0;font-size:clamp(38px,8vw,60px);line-height:1;letter-spacing:-.05em}.message{max-width:460px;margin:22px auto 32px;color:#9da4b4;font-size:18px;line-height:1.7}.progress{height:5px;width:100%;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.07)}.bar{width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6d5dfc,#9b91ff);animation:move 2.6s ease-in-out infinite}.footer{margin:22px 0 0;color:#646b79;font-size:18px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45;transform:scale(.8)}}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}@media(max-width:560px){.card{padding:46px 24px 38px;border-radius:22px}}
  </style>
</head>
<body>
  <main class="page"><div class="glow one"></div><div class="glow two"></div><section class="card"><div class="badge"><span class="dot"></span>PRODUCTION</div><div class="loader"><div class="ring"></div><span>WIP</span></div><div class="eyebrow">Work in progress</div><h1>Production loading.</h1><p class="message">We’re building something new. The production experience is currently under active development.</p><div class="progress"><div class="bar"></div></div><p class="footer">More coming soon.</p></section></main>
</body>
</html>
